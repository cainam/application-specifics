apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ kustom.name }}
    istio: {{ kustom.name }}
  name: {{ kustom.name }}
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 33443
    nodePort: {{ (net.routes | selectattr('gateway','equalto','istio')|first).nodePorts.web_https }}
  selector:
    app: {{ kustom.name }}
    istio: {{ kustom.name }}
  type: NodePort
