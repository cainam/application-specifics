apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ kustom.name }}-fritz
spec:
  podSelector: { matchLabels: { app: colombo } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - ipBlock: { cidr: fd8f:1f5c:2459:0:4a5d:35ff:fe02:9c91/128 }

