- block:
  - name: get IPs to grant access
    shell: |
      kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}' | sed -e 's#$#/32#g'
      echo
      kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}'  | sed -e 's#$#/32#g'
      kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}' | sed -e 's/ /\n/g'
    register: _cluster_ips

  - name: template
    vars:
      kustom:
        namespace: "{{k8s_namespace.key}}"
    template:
      src: "{{ kustomize_dir }}/kustomization.yaml"
      dest: /tmp/longhorn-kustomization.yaml
  - name: write declaration locally
    ansible.builtin.shell: |
      set -o pipefail
      cd "{{ kustomize_dir }}"
      curl -O $(yq -r '.resources[0]' /tmp/longhorn-kustomization.yaml)
      I=$(
      cat longhorn.yaml |yq -r 'select(.metadata.name == "longhorn-manager")|select(.kind == "DaemonSet")|.spec.template.spec.containers[] |select(.name == "longhorn-manager") |.command[] ' |grep "/" |grep :
      cat longhorn.yaml |yq -r 'select(.metadata.name == "longhorn-driver-deployer")|.spec.template.spec.containers[]|select(.name == "longhorn-driver-deployer") |.env[] |select(.name|endswith("IMAGE")) |.value'
      cat longhorn.yaml |yq -r 'select(.metadata.name == "longhorn-ui")|select(.kind == "Deployment")|.spec.template.spec.containers[] |select(.name == "longhorn-ui") |.image'
      )
      for i in ${I}; do
        sed -i -e "s#$i#{{ registry_path }}/"$(basename "$i")"#g" longhorn.yaml
      done
      yq -iy '.resources=["longhorn.yaml"]' /tmp/longhorn-kustomization.yaml
      cp -dp /tmp/longhorn-kustomization.yaml kustomization.yaml
      echo "$I"
    register: source_images
    failed_when: source_images.rc > 1
    changed_when: false
  delegate_to: localhost

- name: "Build image list for {{ var_additional_images }}"
  set_fact:
    temp_img_list: "{{ temp_img_list|default([])  + [ {
        'name': (item.split('/')[-1]).split(':') | first,
        'tag': item.split(':') | last,
        'section': registry_path,
        'type': 'fetch',
        'source': (item.rsplit(':', 1) | first)
      } ] }}"
  loop: "{{ source_images.stdout_lines }}"

- name: "set var {{ var_additional_images }}"
  set_fact:
    "{{ var_additional_images }}": "{{ temp_img_list }}"
