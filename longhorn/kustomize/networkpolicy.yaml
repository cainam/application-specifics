apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-allow-internal-flannel
spec:
  podSelector:
    matchLabels:
      longhorn.io/component: instance-manager
  ingress:
    # Match via Flannel Pod CIDR block instead of podSelector
    - from:
        - ipBlock:
            cidr: {{ k8s.podSubnet }}
      ports:
        - protocol: TCP
          port: 8500
        - protocol: TCP
          port: 8501
        - protocol: TCP
          port: 8502
        - protocol: TCP
          port: 8503
        - protocol: TCP
          port: 8504
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-api-and-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Kubernetes API / DNS as you have today
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.10.10.0/24
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-instance-manager
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              longhorn.io/component: instance-manager
      ports:
        - port: 8503
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-webhook
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              longhorn.io/admission-webhook: longhorn-admission-webhook
      ports:
        - port: 9502
          protocol: TCP

    - to:
        - ipBlock:
            cidr: 10.101.5.141/32
      ports:
        - port: 9502
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-dns
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
