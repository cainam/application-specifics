---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-api
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.10.21/32
        - ipBlock:
            cidr: 10.10.10.22/32
        - ipBlock:
            cidr: 10.10.10.23/32
      ports:
        - protocol: TCP
          port: 6443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-dns
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-instance-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              longhorn.io/component: instance-manager
      ports:
        - protocol: TCP
          port: 8503

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-webhook
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              longhorn.io/admission-webhook: longhorn-admission-webhook
      ports:
        - protocol: TCP
          port: 9502
    - to:
        - ipBlock:
            cidr: 10.101.5.141/32
      ports:
        - protocol: TCP
          port: 9502

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: longhorn-manager

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-to-driver-deployer
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: longhorn-driver-deployer

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-api-to-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.10.21/32
        - ipBlock:
            cidr: 10.10.10.22/32
        - ipBlock:
            cidr: 10.10.10.23/32

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-dns-to-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-instance-manager-to-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              longhorn.io/component: instance-manager

---
# Keep your existing Longhorn-generated policies:
#
#   backing-image-data-source
#   backing-image-manager
#   instance-manager
#   longhorn-manager
#   longhorn-recovery-backend
#   longhorn-webhook
#
# Also keep:
#
#   longhorn-allow-internal-flannel
```

