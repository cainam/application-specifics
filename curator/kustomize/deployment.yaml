{% set container_port = 65536|random(1024) -%}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ kustom.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ kustom.name }}
  template:
    metadata:
      labels:
        app: {{ kustom.name }}
      annotations:
        redeploy-timestamp: "{{ lookup('pipe', 'date +%s') }}"
    spec:
      containers:
      - name: {{ kustom.name }}
        image: {{ kustom.images['python-operator'] }}
        command:
        - kopf
        - run
        - /app/curator.py
        - --all-namespaces
        env:
        - name: USER
          value: kopf
        ports:
        - containerPort: {{ container_port }}
        volumeMounts:
        - mountPath: /app
          name: {{ kustom.name }}
      serviceAccountName: {{ kustom.name }}
      volumes:
      - name: {{ kustom.name }}
        persistentVolumeClaim:
          claimName: {{ kustom.name }}
