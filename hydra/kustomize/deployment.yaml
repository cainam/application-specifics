apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  labels:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: hydra
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra
      app.kubernetes.io/instance: hydra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydra
        app.kubernetes.io/instance: hydra
    spec:
      volumes:
        - name: hydra-config-volume
          configMap:
            name: hydra
      serviceAccountName: hydra
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: hydra
          image: {{ kustom.images[kustom.name] }}
          command:
            - hydra
          args:
            - serve
            - all
            - --config
            - /etc/config/hydra.yaml
          volumeMounts:
            - name: hydra-config-volume
              mountPath: /etc/config
              readOnly: true
          ports:
            - name: http-public
              containerPort: {{ kustom.vars.public_port }}
              protocol: TCP
            - name: http-admin
              containerPort: {{ kustom.vars.admin_port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/alive
              port: {{ kustom.vars.admin_port }}
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ kustom.vars.admin_port }}
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            failureThreshold: 5
            initialDelaySeconds: 1
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 2
          env:
            - name: REDIRECT_URL
              value: "https://{{ net.base_domain }}/oauth2-hydra/callback https://{{ net.domain_external }}:44354/oauth2-hydra/callback"
            - name: URLS_SELF_ISSUER
              value: https://{{ net.base_domain }}/{{ kustom.name }}
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: hydra
                  key: dsn
            - name: SECRETS_SYSTEM
              valueFrom:
                secretKeyRef:
                  name: hydra
                  key: secretsSystem
            - name: SECRETS_COOKIE
              valueFrom:
                secretKeyRef:
                  name: hydra
                  key: secretsCookie
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hydra
                  key: clientID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hydra
                  key: clientSecret
          resources: {}
          securityContext:
            runAsGroup: 65534
            runAsUser: 65534
            seLinuxOptions:
              level: s0:c123,c456
          lifecycle: 
            postStart:
              exec:
                command:
                - /bin/sh
                - -c
                - |
                  HOST="127.0.0.1"
                  PORT="4445"
                  PATH_STR="/clients"
                  while sleep 2; do
                    ( printf "GET /health/alive HTTP/1.1\r\nHost: %s\r\n\r\n" "$HOST" | busybox nc "$HOST" "$PORT") && break
                  done

                  RESPONSE=$( ( printf "GET %s HTTP/1.1\r\n" "$PATH_STR/$CLIENT_ID";printf "Host: %s:%s\r\n" "$HOST" "$PORT";printf "Connection: close\r\n\r\n"; sleep 1; ) | nc "$HOST" "$PORT" )
                  if ! echo "$RESPONSE" | grep -q "HTTP/1.[01] 200"; then
                    PAYLOAD="{\"client_id\":\"$CLIENT_ID\",\"client_name\":\"test\",\"client_secret\":\"$CLIENT_SECRET\",\"grant_types\":[\"authorization_code\",\"refresh_token\"],\"redirect_uris\":[\"$REDIRECT_URL\"],\"response_types\":[\"code\",\"id_token\"],\"scope\":\"offline openid users.write users.read users.edit users.delete email\",\"token_endpoint_auth_method\":\"client_secret_post\"}"
                    {
                    {% raw %}
                        printf "POST %s HTTP/1.1\r\n" "$PATH_STR"
                        printf "Host: %s:%s\r\n" "$HOST" "$PORT"
                        printf "Content-Type: application/json\r\n"
                        printf "Content-Length: %d\r\n" "${#PAYLOAD}"
                        printf "Connection: close\r\n\r\n"
                        printf "%s" "$PAYLOAD"
                        sleep 2
                    {% endraw %}
                    } | nc "$HOST" "$PORT"
                  fi
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsUser: 65534
