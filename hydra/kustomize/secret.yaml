apiVersion: v1
kind: Secret
metadata:
  name: {{ kustom.name }}
  labels:
    app.kubernetes.io/name: {{ kustom.name }}
    app.kubernetes.io/instance: {{ kustom.name }}
type: Opaque
stringData:
  secretsSystem: {{ kustom.vars.system_secret }}
  secretsCookie: {{ kustom.vars.cookie_secret }}
  dsn: memory
  clientID: {{ kustom.vars.clientID }}
  clientSecret: {{ kustom.vars.clientSecret }}

