apiVersion: v1
kind: Secret
metadata:
  name: {{ kustom.name }}
  labels:
    app.kubernetes.io/name: {{ kustom.name }}
    app.kubernetes.io/instance: {{ kustom.name }}
type: Opaque
stringData:
  secretsSystemX: {{ auth.hydra_system_secret }}
  secretsCookieX: {{ auth.cookie_secret }}
  secretsSystem: {{ kustom.vars.system_secret }}
  secretsCookie: {{ kustom.vars.cookie_secret }}
  dsn: memory
  clientID: {{ auth.client_id }}
  clientSecret: {{ auth.client_secret }}

