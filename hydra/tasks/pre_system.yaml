- name: read certificate and set uid and gid for kustomize
  vars:
    admin_service: "{{ application.value.vars.admin_service | default('hydra-admin') }}"
    admin_port: "{{ application.value.vars.admin_port | default('4445') }}"
  set_fact:
    applications: >-
        {{ applications | combine({
             k8s_namespace.key: {
               application.key: {
                 'vars': {
                   'admin_service': admin_service,
                   'admin_port': admin_port,
                   'expose': {'admin_url': 'http://' ~ admin_service ~ '.' ~ k8s_namespace.key ~ ':' ~ admin_port}
                 }
               }
             }
           }, recursive=True) }}

    
 
