apiVersion: v1
kind: Service
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  type: NodePort
#  type: LoadBalancer
#  externalIPs:
#  - {{ (net.routes | selectattr('gateway','equalto',kustom.name)|first).endpointIP }}
  selector:
    app: traefik
  ports:
    - protocol: TCP
      name: web
      port: 80
      targetPort: web
      nodePort: {{ (net.routes | selectattr('gateway','equalto',kustom.name)|first).nodePorts.web80 }}
    - protocol: TCP
      name: websecure
      port: 443
      targetPort: websecure
      nodePort: {{ (net.routes | selectattr('gateway','equalto',kustom.name)|first).nodePorts.web443 }}
#    - protocol: TCP
#      name: traefik-api
#      port: {{ kustom.network.svcPort }}
#      targetPort: traefik # For the dashboard/API
#    - protocol: TCP
#      name: metrics
#      port: 8082
#      targetPort: metrics # For Prometheus metrics
