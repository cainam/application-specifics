apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy
spec:
  forwardAuth:
    addAuthCookiesToResponse:
    - _csrf
    - _oauth2_proxy
    address: {{ kustom.vars.providers["oauth2-proxy"].auth_url }}
    authRequestHeaders:
    - X-Forwarded-Uri
    - Origin
    - Cookie
    authResponseHeaders:
    - X-Auth-Request-User
    - X-Auth-Request-Email
    - Set-Cookie
    trustForwardHeader: true
    maxResponseBodySize: 1048576  # Limit in bytes (e.g., 1MB)

