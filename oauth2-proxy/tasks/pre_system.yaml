- name: read certificate and set uid and gid for kustomize
  set_fact:
    applications: >-
        {{ applications | combine({
             k8s_namespace.key: {
               application.key: {
                 'network': {
                   'prefix': application.value.vars.oauth2_path,
                   'rewrite': application.value.vars.oauth2_path
                 },
                 'vars': {
                   'expose': {'base_url': 'https://' ~ net.base_domain ~ application.value.network.prefix },
                   'redirect_url': 'https://' ~ application.value.network.domain ~ application.value.vars.oauth2_path ~ '/callback https://' ~ net.domain_external ~ ':' ~ (net.routes | selectattr('domain','equalto',application.value.network.domain)|map(attribute='external_port')|first) ~ application.value.vars.oauth2_path ~ '/callback',
                   'auth_url': 'http://' ~ application.key ~ '.' ~ k8s_namespace ~ ':80/oauth2/auth'
                 }
               }
             }
           }, recursive=True) }}

    
 
