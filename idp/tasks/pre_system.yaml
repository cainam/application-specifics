- name: read certificate and set uid and gid for kustomize
  set_fact:
    applications: >-
        {{ applications | combine({
             k8s_namespace.key: {
               application.key: {
                 'vars': {
                   'expose': {'base_url': 'https://' ~ net.base_domain ~ application.value.network.prefix }
                 }
               }
             }
           }, recursive=True) }}

    
 
